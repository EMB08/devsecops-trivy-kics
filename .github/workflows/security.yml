name: DevSecOps Security Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to scan"
        required: true
        default: "vulnerable"
        type: choice
        options:
          - vulnerable
          - secure

jobs:
  trivy-vulnerable:
    name: Trivy - Vulnerable Target
    if: inputs.target == 'vulnerable'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Juice Shop image
        run: docker pull bkimminich/juice-shop:latest

      - name: Run Trivy
        run: |
          docker run --rm \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            bkimminich/juice-shop:latest

  kics-vulnerable:
    name: KICS - Vulnerable Target
    if: inputs.target == 'vulnerable'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KICS
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/terragoat:/path:ro" \
            checkmarx/kics:latest scan \
            -p /path/terraform/aws \
            --fail-on HIGH,CRITICAL

  trivy-secure:
    name: Trivy - Secure Target
    if: inputs.target == 'secure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build secure target
        run: docker build -t devsecops-secure:latest secure-fixture

      - name: Run Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            devsecops-secure:latest

  kics-secure:
    name: KICS - Secure Target
    if: inputs.target == 'secure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KICS
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/secure-fixture:/path:ro" \
            checkmarx/kics:latest scan \
            -p /path \
            --fail-on HIGH,CRITICAL
